name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        eslint-version: ['9.39.1', '10.0.3']
    runs-on: ubuntu-latest
    name: check (eslint ${{ matrix.eslint-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Set ESLint version
        run: bun add -d --exact eslint@${{ matrix.eslint-version }}
      - name: Lint
        run: bun lint
      - name: Test
        run: bun run test --watch=false
      - name: Test build
        run: bun run build
